<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Management System</title>

<link rel="stylesheet" href="style.css">

</head><body><header>
    <h1>Student Management System</h1>
    <p>Manage student information easily</p>
</header>

<main>

    <!-- Student Form -->
    <section class="form-section">

        <h2>Add Student</h2>

        <form id="studentForm">

            <label for="name">Student Name</label>
            <input type="text" id="name" placeholder="Enter student name" required>

            <label for="roll">Roll Number</label>
            <input type="text" id="roll" placeholder="Enter roll number" required>

            <label for="department">Department</label>
            <select id="department" required>
                <option value="">Select Department</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>
            </select>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter email" required>

            <button type="submit">Add Student</button>

        </form>

    </section>


    <!-- Student List -->
    <section class="student-section">

        <h2>Student List</h2>

        <input
            type="text"
            id="search"
            placeholder="Search student by name or roll number"
        >

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                </tbody>

            </table>

        </div>

    </section>

</main>


<footer>
    <p>© 2026 Student Management System</p>
</footer>


<script src="script.js"></script>

</body></html>
